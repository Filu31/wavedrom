name: Build and artifacts

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build bundles
        run: |
          npm run dist
          npm run dist.min
          npm run unpkg
          npm run unpkg.min

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wavedrom-build-${{ matrix.node-version }}
          path: |
            wavedrom.js
            wavedrom.min.js
            wavedrom.unpkg.js
            wavedrom.unpkg.min.js

  publish:
    if: false    #if github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org/
      - name: Install & Build
        run: |
          npm ci
          npm run dist
          npm run dist.min
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public
